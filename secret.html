<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <title>Skyddad sida | Inloggningssystem</title>
    <link rel="stylesheet" href="css/style.css">

<body>
    <header>
        <h1>Inloggningssystem</h1>
        <nav>
            <ul>
                <li><a href="index.html">Start / Logga in</a></li>
                <li><a href="secret.html" class="active">Skyddad sida</a></li>
                <li><a href="#" id="logout-btn" style="color: #ff4d4d;">Logga ut</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Skyddad undersida</h2>
        <p id="welcome-msg">Verifierar behörighet...</p>

        <div id="error-message" class="error"></div>
        <div id="success-message" class="success"></div>

        <!-- Tabell för att visa skyddad data från API:et -->
        <div id="protected-content" style="display: none;">
            <h3>Registrerade användare i databasen:</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Användarnamn</th>
                    </tr>
                </thead>
                <tbody id="users-list">
                    <!-- Fylls i av JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>DT207G Backend-baserad webbutveckling</p>
        <p>Laboration 4 - Autentisering och säkerhet</p>
        <p>MIUN VT2026</p>
        <p>Ardalan Sale</p>
    </footer>

    <script src="js/main.js"></script>

</html>
